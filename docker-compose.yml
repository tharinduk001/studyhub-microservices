x-common: &common
  environment: &env
    SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
    INTERNAL_KEY: ${INTERNAL_KEY:-internal-dev-key}
    REDIS_URL: redis://redis:6379/1
    DB_PATH: /data/db.sqlite
  restart: unless-stopped
  depends_on: [redis]

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped

  user-service:
    <<: *common
    build: ./studyhub-microservices/user-service
    ports: ["8001:8000"]
    volumes: ["user-data:/data"]

  room-service:
    <<: *common
    build: ./studyhub-microservices/room-service
    ports: ["8002:8000"]
    environment:
      <<: *env
      ACTIVITY_URL: http://activity-service:8000
    volumes: ["room-data:/data"]
    depends_on: [redis, activity-service]

  message-service:
    <<: *common
    build: ./studyhub-microservices/message-service
    ports: ["8003:8000"]
    environment:
      <<: *env
      ROOM_URL: http://room-service:8000
      ACTIVITY_URL: http://activity-service:8000
    volumes: ["message-data:/data"]
    depends_on: [redis, room-service, activity-service]

  activity-service:
    <<: *common
    build: ./studyhub-microservices/activity-service
    ports: ["8004:8000"]
    volumes: ["activity-data:/data"]

volumes: {user-data: {}, room-data: {}, message-data: {}, activity-data: {}}
