name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install django==5.1.4 requests redis whitenoise
      - name: Unit tests (one run per service)
        run: |
          for s in user-service room-service message-service activity-service notification-service gateway; do
            echo "=== $s ==="
            (cd studyhub-microservices/$s && python manage.py test) || exit 1
          done

  end-to-end:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx
      - name: Start all services (Docker Compose)
        run: docker compose up --build -d
      - name: Wait for the gateway
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health > /dev/null && exit 0
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Smoke test (end-to-end through the gateway)
        run: python scripts/smoke_test.py
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop
        if: always()
        run: docker compose down -v
